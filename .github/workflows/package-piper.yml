name: Paquete completo Piper 398 VR1 lectura V2 - STAGING
on:
  push:
    branches:
      - qa/piper-fast-letter-v2
    paths:
      - 'piper-audio/manifest.json'
      - '.github/workflows/package-piper.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/piper-fast-letter-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install free JSZIP/diff dependencies
        run: npm install --no-save --no-package-lock jszip@3.10.2 diff@9.0.0
      - name: Verify 27 letters, direct pronunciation and faster MP3
        run: python3 tools/qa_piper_fast_v2.py
      - name: Build full verified Piper VR1 V2 release ZIP
        run: node tools/package_piper_release.mjs
      - name: Upload complete release ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MAMBAPALABRA_B1.13.1_UX1_PIPER398_VR1_LECTURA_V2_STAGING
          path: dist/MAMBAPALABRA_B1.13.1_UX1_PIPER398_VR1_LECTURA_V2_STAGING.zip
          retention-days: 30
