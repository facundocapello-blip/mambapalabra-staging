name: Deploy Fish RC6 (+22% definitions) to isolated STAGING Pages
on:
  push:
    branches: [ux/b1131-presenter-iphone]
    paths: ['.github/workflows/deploy-fish-rc6-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: mambapalabra-staging-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified Fish RC6 release (no audio generation)
        uses: actions/download-artifact@v4
        with:
          name: MAMBAPALABRA_FISH398_VOZ_UNICA_RC6_STAGING_QA
          run-id: 39529487189
          github-token: ${{ github.token }}
          path: dist
      - name: Validate RC6 and extract to isolated Pages
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json,hashlib
          zpath=Path('dist/MAMBAPALABRA_B1.13.1_UX1_FISH398_VOZ_UNICA_RC6_STAGING.zip')
          root=Path('_site').resolve()
          root.mkdir(parents=True,exist_ok=True)
          with ZipFile(zpath) as z:
            for entry in z.infolist():
              assert (root/entry.filename).resolve().is_relative_to(root)
            z.extractall(root)
          version='B1.13.1-UX1-FISH398-VOZ-UNICA-RC6-STAGING'
          release=json.loads((root/'FISH_SPEED_RELEASE.json').read_text())
          assert release['version']==version and release['definition_playback_rate']==1.22
          assert release['changed_audio_files']==0 and release['added_audio_files']==2
          assert (root/'FISH_TURN_RELEASE.json').exists()
          assert len(list((root/'fish-bank').glob('*.mp3')))==811
          assert len(list((root/'fish-audio').glob('*.mp3')))==10
          assert len(list((root/'new-audio').glob('*.mp3')))==188
          assert not (root/'piper-audio').exists()
          s=(root/'index.html').read_text()
          assert 'FISH_DEFINITION_PLAYBACK_RATE=1.22' in s
          assert 'return deviceSpeak(' not in s
          manifest=root/'manifest.webmanifest'
          if manifest.exists():
            m=json.loads(manifest.read_text())
            m['start_url']='/mambapalabra-staging/'
            manifest.write_text(json.dumps(m,ensure_ascii=False))
          (root/'.nojekyll').touch()
          (root/'STAGING_BUILD.json').write_text(json.dumps({
            'version':version,'fish_mp3':821,'definition_playback_rate':1.22,'short_turn_cues':2,
            'index_sha256':hashlib.sha256(s.encode()).hexdigest(),'production_untouched':True
          },indent=2))
          print('Ready for isolated STAGING Pages:',version)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
  live-qa:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/fish-voice-free-api-test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live browser QA dependencies
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify deployed RC6 manifest and speed factor
        run: |
          python - <<'PY'
          import json,urllib.request
          base='https://facundocapello-blip.github.io/mambapalabra-staging/'
          with urllib.request.urlopen(base+'STAGING_BUILD.json',timeout=30) as r:info=json.load(r)
          assert info['version']=='B1.13.1-UX1-FISH398-VOZ-UNICA-RC6-STAGING',info
          assert info['definition_playback_rate']==1.22,info
          assert info['fish_mp3']==821 and info['short_turn_cues']==2 and info['production_untouched']
          for path in ('fish-audio/09_incorrecto_corto.mp3','fish-audio/10_pasapalabra_corto.mp3'):
            with urllib.request.urlopen(base+path,timeout=30) as r:assert r.status==200 and len(r.read())>1000
          print('PASS: HTTPS RC6 speed manifest')
          PY
      - name: Chromium and WebKit - live HTTPS intro, Fish definition and MP3 fetch
        env:
          EXPECTED_FISH_VERSION: B1.13.1-UX1-FISH398-VOZ-UNICA-RC6-STAGING
        run: python tools/qa_fish_rc6_live_pages.py
      - name: Chromium and WebKit - real two-session online STAGING
        run: python tools/qa_fish_rc6_online_live.py
