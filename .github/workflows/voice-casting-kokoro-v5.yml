name: Casting Kokoro V5 - voces masculinas
on:
  push:
    branches: [qa/voice-casting-kokoro-v5]
    paths:
      - 'tools/voice_casting_kokoro_v5.py'
      - '.github/workflows/voice-casting-kokoro-v5.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  casting:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/voice-casting-kokoro-v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline synthesizer
        run: |
          pip install kokoro-onnx soundfile
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg espeak-ng
      - name: Download open model and voices
        run: |
          curl -fLsS --retry 3 -o kokoro-v1.0.int8.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/kokoro-v1.0.int8.onnx
          curl -fLsS --retry 3 -o voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.1/voices-v1.0.bin
          test "$(stat -c%s kokoro-v1.0.int8.onnx)" -gt 90000000
          test "$(stat -c%s voices-v1.0.bin)" -gt 20000000
      - name: Synthesize and validate male Spanish samples
        run: |
          python tools/voice_casting_kokoro_v5.py
          test "$(find voice-casting-kokoro-v5 -name '*.mp3' | wc -l)" -eq 4
          for f in voice-casting-kokoro-v5/*.mp3; do ffmpeg -v error -i "$f" -f null - || exit 1; done
      - uses: actions/upload-artifact@v4
        with:
          name: Mambapalabra-voces-masculinas-Kokoro-V5
          path: voice-casting-kokoro-v5/
          retention-days: 30
