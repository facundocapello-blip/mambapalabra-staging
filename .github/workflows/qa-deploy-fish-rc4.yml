name: Fish RC4 definition speed - isolated STAGING QA
on:
  push:
    branches: [qa/fish-voice-free-api-test]
    paths:
      - '.github/workflows/qa-deploy-fish-rc4.yml'
      - 'tools/package_fish_definition_speed_rc4.py'
      - 'tools/qa_fish_definition_speed_rc4.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA dependencies
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Restore verified RC3 release (no audio generation)
        uses: actions/download-artifact@v4
        with:
          name: MAMBAPALABRA_FISH398_VOZ_UNICA_RC3_STAGING_QA
          run-id: 39361651619
          github-token: ${{ github.token }}
          path: dist
      - name: Package selective +8% definition speed
        run: python tools/package_fish_definition_speed_rc4.py
      - name: Validate generated inline JavaScript syntax
        run: |
          python - <<'PY'
          import re,zipfile
          with zipfile.ZipFile('dist/MAMBAPALABRA_B1.13.1_UX1_FISH398_VOZ_UNICA_RC4_STAGING.zip') as z:
            s=z.read('index.html').decode()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          assert scripts
          open('/tmp/fish-rc4-inline.js','w').write('\n'.join(scripts))
          PY
          node --check /tmp/fish-rc4-inline.js
      - name: Chromium and WebKit - selective definition speed regression
        run: python tools/qa_fish_definition_speed_rc4.py
      - name: Chromium and WebKit - gameplay regression on RC4
        env:
          QA_FISH_FULL: '1'
          QA_FISH_RC3: '1'
        run: |
          cp dist/MAMBAPALABRA_B1.13.1_UX1_FISH398_VOZ_UNICA_RC4_STAGING.zip dist/MAMBAPALABRA_B1.13.1_UX1_FISH398_VOZ_UNICA_RC3_STAGING.zip
          python tools/qa_fish_intro_staging.py
      - name: Chromium and WebKit - full match and sudden death on RC4
        run: python tools/qa_fish_sudden_full.py
      - name: Archive verified RC4 release for rollback
        uses: actions/upload-artifact@v4
        with:
          name: MAMBAPALABRA_FISH398_VOZ_UNICA_RC4_STAGING_QA
          path: dist/MAMBAPALABRA_B1.13.1_UX1_FISH398_VOZ_UNICA_RC4_STAGING.zip
          retention-days: 30
