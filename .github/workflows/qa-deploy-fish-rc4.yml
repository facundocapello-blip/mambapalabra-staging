name: Fish RC4 definition speed - QA and isolated STAGING deploy
on:
  push:
    branches: [qa/fish-voice-free-api-test]
    paths:
      - '.github/workflows/qa-deploy-fish-rc4.yml'
      - 'tools/package_fish_definition_speed_rc4.py'
      - 'tools/qa_fish_definition_speed_rc4.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: mambapalabra-staging-pages
  cancel-in-progress: false
jobs:
  qa-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA dependencies
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Restore verified RC3 release (no audio generation)
        uses: actions/download-artifact@v4
        with:
          name: MAMBAPALABRA_FISH398_VOZ_UNICA_RC3_STAGING_QA
          run-id: 39361651619
          github-token: ${{ github.token }}
          path: dist
      - name: Package selective +8% definition speed
        run: python tools/package_fish_definition_speed_rc4.py
      - name: Validate generated inline JavaScript syntax
        run: |
          python - <<'PY'
          import re,zipfile
          with zipfile.ZipFile('dist/MAMBAPALABRA_B1.13.1_UX1_FISH398_VOZ_UNICA_RC4_STAGING.zip') as z:
            s=z.read('index.html').decode()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          assert scripts
          open('/tmp/fish-rc4-inline.js','w').write('\n'.join(scripts))
          PY
          node --check /tmp/fish-rc4-inline.js
      - name: Chromium and WebKit - selective definition speed regression
        run: python tools/qa_fish_definition_speed_rc4.py
      - name: Chromium and WebKit - gameplay regression on RC4
        env:
          QA_FISH_FULL: '1'
          QA_FISH_RC3: '1'
        run: |
          cp dist/MAMBAPALABRA_B1.13.1_UX1_FISH398_VOZ_UNICA_RC4_STAGING.zip dist/MAMBAPALABRA_B1.13.1_UX1_FISH398_VOZ_UNICA_RC3_STAGING.zip
          python tools/qa_fish_intro_staging.py
      - name: Chromium and WebKit - full match and sudden death on RC4
        run: python tools/qa_fish_sudden_full.py
      - name: Archive verified RC4 release for rollback
        uses: actions/upload-artifact@v4
        with:
          name: MAMBAPALABRA_FISH398_VOZ_UNICA_RC4_STAGING_QA
          path: dist/MAMBAPALABRA_B1.13.1_UX1_FISH398_VOZ_UNICA_RC4_STAGING.zip
          retention-days: 30
      - name: Extract verified RC4 to isolated Pages site
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import json,hashlib
          zpath=Path('dist/MAMBAPALABRA_B1.13.1_UX1_FISH398_VOZ_UNICA_RC4_STAGING.zip')
          root=Path('_site').resolve()
          root.mkdir(parents=True,exist_ok=True)
          with ZipFile(zpath) as z:
            for entry in z.infolist():
              assert (root/entry.filename).resolve().is_relative_to(root)
            z.extractall(root)
          version='B1.13.1-UX1-FISH398-VOZ-UNICA-RC4-STAGING'
          release=json.loads((root/'FISH_SPEED_RELEASE.json').read_text())
          assert release['version']==version and release['definition_speed_multiplier']==1.08
          assert release['changed_audio_files']==0
          assert len(list((root/'fish-bank').glob('*.mp3')))==811
          assert len(list((root/'fish-audio').glob('*.mp3')))==8
          assert not (root/'piper-audio').exists()
          s=(root/'index.html').read_text()
          assert 'FISH_DEFINITION_SPEED_MULTIPLIER=1.08' in s
          assert 'return deviceSpeak(' not in s
          manifest=root/'manifest.webmanifest'
          if manifest.exists():
            m=json.loads(manifest.read_text())
            m['start_url']='/mambapalabra-staging/'
            manifest.write_text(json.dumps(m,ensure_ascii=False))
          (root/'.nojekyll').touch()
          (root/'STAGING_BUILD.json').write_text(json.dumps({
            'version':version,'fish_mp3':819,'definition_speed_multiplier':1.08,
            'index_sha256':hashlib.sha256(s.encode()).hexdigest(),'production_untouched':True
          },indent=2))
          print('RC4 staged for isolated Pages deploy:',version)
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
  live-qa:
    needs: qa-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live browser QA dependencies
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Verify RC4 HTTPS live, intro, Fish definition and MP3 fetch
        env:
          EXPECTED_FISH_VERSION: B1.13.1-UX1-FISH398-VOZ-UNICA-RC4-STAGING
        run: python tools/qa_fish_live_pages.py
      - name: Verify real STAGING online rooms in two browser contexts
        run: python tools/qa_fish_online_live.py
