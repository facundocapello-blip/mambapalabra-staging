name: Casting Kokoro masculino V4 offline
on:
  push:
    branches: [qa/voice-casting-argentine-v4]
    paths:
      - '.github/workflows/voice-casting-kokoro-v4.yml'
      - 'tools/voice_casting_kokoro_v4.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/voice-casting-argentine-v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install open-source Kokoro
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install kokoro==0.9.4 soundfile
      - name: Synthesize 2 male voices with two identical phrases
        run: python tools/voice_casting_kokoro_v4.py
      - name: Upload audition audio
        uses: actions/upload-artifact@v4
        with:
          name: Mambapalabra-Kokoro-voces-masculinas-V4
          path: voice-casting-kokoro-v4/
          retention-days: 30
