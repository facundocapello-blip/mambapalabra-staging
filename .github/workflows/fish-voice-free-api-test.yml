name: Fish Audio - free voice casting (STAGING only)
on:
  push:
    branches: [qa/fish-voice-free-api-test]
    paths:
      - 'tools/test_fish_voice_free_api.py'
      - '.github/workflows/fish-voice-free-api-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  casting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm configured secret exists (value never logged)
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          if [ -z "$FISH_API_KEY" ]; then echo 'FISH_API_KEY secret missing'; exit 2; fi
          echo 'FISH_API_KEY configured'
      - name: Generate three MP3 samples using free Fish model
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: python tools/test_fish_voice_free_api.py
      - name: Install FFmpeg validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Validate MP3 decoding and count
        run: |
          test "$(find artifacts/fish-voice-free-test -name '*.mp3' | wc -l)" -eq 3
          for f in artifacts/fish-voice-free-test/*.mp3; do
            ffprobe -v error -show_entries format=duration -of default=nw=1 "$f"
            ffmpeg -v error -i "$f" -f null - || exit 1
          done
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Mambapalabra-Fish-Voice-Free-Casting
          path: artifacts/fish-voice-free-test/
          retention-days: 30
