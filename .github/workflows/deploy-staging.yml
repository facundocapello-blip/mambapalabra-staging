name: Deploy B1.12 STAGING
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-staging.yml'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Fetch isolated B1.12 candidate source
        uses: actions/checkout@v4
        with:
          repository: facundocapello-blip/Mambapalabra
          ref: qa/b112-guest-voice-handoff
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate candidate and package all 188 audio files
        run: python candidate/tools/package_release_b112.py
      - name: Extract verified release ZIP into Pages artifact
        run: |
          mkdir -p _site
          python - <<'PY'
          from zipfile import ZipFile
          from pathlib import Path
          with ZipFile('candidate/dist/MAMBAPALABRA_B1_12_STAGING.zip') as z:
              for entry in z.infolist():
                  target=(Path('_site')/entry.filename).resolve()
                  assert target.is_relative_to(Path('_site').resolve())
              z.extractall('_site')
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
