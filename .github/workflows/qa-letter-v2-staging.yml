name: Lectura V2 STAGING - navegadores y regresion
on:
  push:
    branches:
      - qa/piper-fast-letter-v2
    paths:
      - '.github/workflows/qa-letter-v2-staging.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/piper-fast-letter-v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium and WebKit
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Full game: first clue, pass, wrong, correct and MP3
        run: python tools/qa_piper_staging.py
      - name: 5 games in each browser - question rotation
        run: python tools/qa_randomization_staging.py
      - name: VR1 spoken feedback and actual MP3 playback
        run: python tools/qa_voice_audio_start_vr1.py
      - name: Preserve screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piper-letter-v2-browser-screenshots
          path: artifacts/piper-browser/
          if-no-files-found: ignore
