name: VR1 valoración rápida por voz STAGING
on:
  push:
    branches: [qa/piper-audio-398]
    paths:
      - 'tools/qa_voice_fast_vr1.py'
      - '.github/workflows/qa-voice-fast-vr1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/piper-audio-398
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build old release for bug reproduction
        run: |
          npm install --no-save --no-package-lock jszip@3.10.2 diff@9.0.0
          node tools/package_piper_release.mjs
      - name: Install browser engines
        run: |
          pip install playwright==1.58.0
          python -m playwright install --with-deps chromium webkit
      - name: Reproduce old issue and test live STAGING VR1
        run: python tools/qa_voice_fast_vr1.py
